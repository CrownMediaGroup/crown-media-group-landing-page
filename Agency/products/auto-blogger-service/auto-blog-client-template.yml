name: Auto-Blog — [CLIENT_BUSINESS_NAME]
# Crown Media Group Auto-Blogger Service
# Generated by Crown Media Group for [CLIENT_BUSINESS_NAME]
# Setup questions: king@crownmediagroup.co | crownmediagroup.co

on:
  schedule:
    # 4x daily — 8am, 12pm, 4pm, 8pm EST (Mon–Fri + Sun, Sat skipped)
    - cron: '0 13 * * 0,1,2,3,4'
    - cron: '0 17 * * 0,1,2,3,4'
    - cron: '0 21 * * 0,1,2,3,4'
    - cron: '0 1  * * 0,1,2,3,4'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom topic'
        required: false

jobs:
  write-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        # Requires: @anthropic-ai/sdk, axios, cheerio, resend in package.json

      - name: Research & fill queue
        if: ${{ !inputs.topic }}
        env:
          CLIENT_CONFIG: '[CLIENT_SLUG]'
          CI: true
        run: node scripts/blog-researcher-client.js --count 20 || true

      - name: Generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLIENT_CONFIG: '[CLIENT_SLUG]'
          CI: true
        run: |
          node scripts/blog-writer-client.js --from-queue --publish || \
          node scripts/blog-writer-client.js \
            --topic "Marketing tips for [CLIENT_CITY] businesses" \
            --publish

      - name: Commit and push
        run: |
          git config user.name "Crown Media Blog Bot"
          git config user.email "king@crownmediagroup.co"
          git add content/blog/
          git diff --staged --quiet || git commit -m "auto-blog: $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Email client with social captions
        if: success()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLIENT_EMAIL: '[CLIENT_EMAIL]'
          CLIENT_BUSINESS: '[CLIENT_BUSINESS_NAME]'
          BLOG_URL: '[CLIENT_BLOG_URL]'
        run: node scripts/blog-distributor-client.js || true
