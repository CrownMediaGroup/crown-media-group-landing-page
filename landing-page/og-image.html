<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#1A1A3E;display:flex;align-items:center;justify-content:center;font-family:'Georgia',serif}
.bg-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:900px;height:500px;background:radial-gradient(ellipse,rgba(201,152,26,0.18) 0%,transparent 70%);pointer-events:none}
.container{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;text-align:center}
.logo{width:160px;height:160px;object-fit:contain;filter:drop-shadow(0 0 40px rgba(201,152,26,0.5))}
.name{font-size:64px;font-weight:700;color:#FFFFFF;letter-spacing:-0.02em;line-height:1}
.tagline{font-size:22px;color:rgba(232,184,50,0.9);letter-spacing:0.12em;text-transform:uppercase;font-family:'Arial',sans-serif;font-weight:400}
.divider{width:120px;height:2px;background:linear-gradient(90deg,transparent,#C9981A,transparent)}
.location{font-size:16px;color:rgba(255,255,255,0.4);letter-spacing:0.2em;text-transform:uppercase;font-family:'Arial',sans-serif}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="container">
  <img class="logo" src="../assets/crown-media-group-logo.png" alt="Crown Media Group">
  <div class="name">Crown Media Group</div>
  <div class="divider"></div>
  <div class="tagline">AI-Powered Marketing</div>
  <div class="location">Columbia, SC &nbsp;&bull;&nbsp; crownmediagroup.co</div>
</div>
</body>
</html>
