<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Dashboard — Crown Media Group</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Plyr — video player -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

<!-- FullCalendar — scheduling view -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">

<!-- Toastify — notifications -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root {
  --bg: #0A1628;
  --bg2: #0F1E35;
  --bg3: #152440;
  --royal: #1A3A5C;
  --gold: #C9981A;
  --gold-light: #E8B832;
  --gold-pale: rgba(201, 152, 26, 0.12);
  --text: #E8E8F0;
  --text-mid: #9A9AB0;
  --text-dim: #5A5A7A;
  --border: rgba(201, 152, 26, 0.15);
  --border-soft: rgba(255, 255, 255, 0.06);
  --green: #16a34a;
  --red: #dc2626;
  --orange: #ea580c;
  --blue: #2563eb;
  --radius: 10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Layout ──────────────────────────────────────────────── */
.app { display: flex; flex-direction: column; height: 100vh; }

.topbar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border-soft);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
  flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.topbar-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--gold-light);
  letter-spacing: 0.02em;
}
.topbar-badge {
  background: var(--gold-pale);
  color: var(--gold);
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.topbar-right { display: flex; align-items: center; gap: 12px; }

/* ── Tabs ────────────────────────────────────────────────── */
.tabs-bar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 4px;
  flex-shrink: 0;
}
.tab-btn {
  padding: 14px 18px;
  font-size: 0.83rem;
  font-weight: 600;
  color: var(--text-mid);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  letter-spacing: 0.02em;
  transition: color 0.15s, border-color 0.15s;
  font-family: 'Inter', sans-serif;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--gold-light); border-bottom-color: var(--gold); }

/* ── Content ─────────────────────────────────────────────── */
.tab-content { flex: 1; overflow: hidden; display: flex; }
.tab-pane { display: none; flex: 1; overflow: hidden; }
.tab-pane.active { display: flex; }

/* ── Stats bar ───────────────────────────────────────────── */
.stats-bar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border-soft);
  padding: 16px 24px;
  display: flex;
  gap: 24px;
  flex-shrink: 0;
}
.stat-item { text-align: center; }
.stat-num {
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--gold-light);
  line-height: 1;
}
.stat-label {
  font-size: 0.7rem;
  color: var(--text-mid);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 3px;
}

/* ── Projects list ───────────────────────────────────────── */
.projects-pane {
  flex: 1;
  display: flex;
  overflow: hidden;
}
.projects-sidebar {
  width: 380px;
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-filters {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.filter-chip {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  color: var(--text-mid);
  background: none;
  transition: all 0.15s;
  font-family: 'Inter', sans-serif;
}
.filter-chip:hover { border-color: var(--gold); color: var(--text); }
.filter-chip.active { background: var(--gold-pale); border-color: var(--gold); color: var(--gold-light); }

.projects-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.projects-list::-webkit-scrollbar { width: 4px; }
.projects-list::-webkit-scrollbar-track { background: transparent; }
.projects-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.project-row {
  padding: 14px 12px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid transparent;
  margin-bottom: 4px;
  transition: all 0.15s;
}
.project-row:hover { background: var(--bg3); }
.project-row.selected { background: var(--bg3); border-color: var(--gold); }

.project-row-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.project-client {
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--text);
}
.project-date {
  font-size: 0.72rem;
  color: var(--text-dim);
}
.project-title {
  font-size: 0.78rem;
  color: var(--text-mid);
  margin-bottom: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.project-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Status badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.badge-uploaded  { background: rgba(37,99,235,.15); color: #60a5fa; }
.badge-processing{ background: rgba(234,88,12,.15); color: #fb923c; }
.badge-ready     { background: rgba(161,83,240,.15); color: #c084fc; }
.badge-approved  { background: rgba(22,163,74,.15); color: #4ade80; }
.badge-scheduled { background: rgba(20,184,166,.15); color: #2dd4bf; }
.badge-posted    { background: rgba(201,152,26,.15); color: #e8b832; }
.badge-rejected  { background: rgba(220,38,38,.15); color: #f87171; }
.badge-delivered { background: rgba(75,85,99,.15); color: #9ca3af; }

.platform-tags {
  display: flex;
  gap: 3px;
  flex-wrap: wrap;
}
.ptag {
  font-size: 0.65rem;
  padding: 1px 6px;
  border-radius: 3px;
  background: rgba(255,255,255,.06);
  color: var(--text-mid);
}

/* ── Detail panel ────────────────────────────────────────── */
.project-detail {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.project-detail::-webkit-scrollbar { width: 4px; }
.project-detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  gap: 12px;
}
.empty-state svg { opacity: 0.3; }
.empty-state p { font-size: 0.9rem; }

.detail-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.detail-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--text);
}
.detail-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  flex-wrap: wrap;
}

/* Action buttons */
.action-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn {
  padding: 9px 18px;
  border-radius: 6px;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Inter', sans-serif;
  text-transform: uppercase;
}
.btn-approve  { background: rgba(22,163,74,.15); color: #4ade80; border: 1px solid rgba(22,163,74,.3); }
.btn-approve:hover  { background: rgba(22,163,74,.25); }
.btn-reject   { background: rgba(220,38,38,.1); color: #f87171; border: 1px solid rgba(220,38,38,.25); }
.btn-reject:hover   { background: rgba(220,38,38,.2); }
.btn-process  { background: rgba(234,88,12,.1); color: #fb923c; border: 1px solid rgba(234,88,12,.25); }
.btn-process:hover  { background: rgba(234,88,12,.2); }
.btn-caption  { background: rgba(161,83,240,.1); color: #c084fc; border: 1px solid rgba(161,83,240,.25); }
.btn-caption:hover  { background: rgba(161,83,240,.2); }
.btn-schedule { background: rgba(20,184,166,.1); color: #2dd4bf; border: 1px solid rgba(20,184,166,.25); }
.btn-schedule:hover { background: rgba(20,184,166,.2); }
.btn-gold     { background: var(--gold-pale); color: var(--gold-light); border: 1px solid var(--border); }
.btn-gold:hover     { background: rgba(201,152,26,.2); }

/* ── Section blocks ──────────────────────────────────────── */
.detail-section {
  background: var(--bg2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  overflow: hidden;
}
.detail-section-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-soft);
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-mid);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.detail-section-body { padding: 16px; }

/* Video player */
.plyr { border-radius: 8px; overflow: hidden; }

/* Caption cards */
.caption-card {
  background: var(--bg3);
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 10px;
}
.caption-card:last-child { margin-bottom: 0; }
.caption-platform {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--gold);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.caption-text {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 0.82rem;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  resize: vertical;
  min-height: 80px;
  line-height: 1.5;
}
.caption-text:focus { outline: none; border-color: var(--gold); }
.caption-hashtags {
  margin-top: 6px;
  font-size: 0.75rem;
  color: var(--text-dim);
  line-height: 1.4;
}

/* Schedule picker */
.schedule-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.schedule-row input[type="datetime-local"] {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px 12px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  flex: 1;
  min-width: 200px;
}
.schedule-row input:focus { outline: none; border-color: var(--gold); }

/* Notes textarea */
.notes-textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 0.85rem;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  resize: vertical;
  min-height: 70px;
}
.notes-textarea:focus { outline: none; border-color: var(--gold); }

/* Info grid */
.info-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.info-item {}
.info-label { font-size: 0.7rem; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px; }
.info-value { font-size: 0.85rem; color: var(--text); }
.info-link  { color: var(--gold); text-decoration: none; font-size: 0.85rem; }
.info-link:hover { text-decoration: underline; }

/* Upload file input */
.upload-btn-wrap { position: relative; }
.upload-btn-wrap input[type="file"] { position: absolute; opacity: 0; inset: 0; cursor: pointer; }

/* ── Revenue tab ─────────────────────────────────────────── */
.revenue-pane {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.chart-wrap {
  background: var(--bg2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 20px;
  height: 260px;
}

/* ── Calendar tab ────────────────────────────────────────── */
.calendar-pane {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}
#calendar { background: var(--bg2); border-radius: var(--radius); padding: 16px; }

/* ── Login overlay ───────────────────────────────────────── */
#login-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.login-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px 36px;
  width: 360px;
  text-align: center;
}
.login-box h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}
.login-box p { font-size: 0.85rem; color: var(--text-mid); margin-bottom: 24px; }
.login-input {
  width: 100%;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 0.9rem;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  margin-bottom: 14px;
  text-align: center;
  letter-spacing: 0.3em;
}
.login-input:focus { outline: none; border-color: var(--gold); }
.login-btn {
  width: 100%;
  background: var(--royal);
  color: var(--gold-light);
  border: none;
  padding: 13px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s;
  font-family: 'Inter', sans-serif;
}
.login-btn:hover { background: #2D2D5A; }
.login-error { color: #f87171; font-size: 0.8rem; margin-top: 8px; min-height: 20px; }

/* ── Toast override ──────────────────────────────────────── */
.toastify {
  font-family: 'Inter', sans-serif !important;
  font-size: 0.85rem !important;
  border-radius: 8px !important;
}

/* ── Loading spinner ─────────────────────────────────────── */
.spinner {
  width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: var(--gold-light);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Mobile ──────────────────────────────────────────────── */
@media (max-width: 768px) {
  .projects-sidebar { width: 100%; }
  .projects-pane { flex-direction: column; }
}
</style>
</head>
<body>

<!-- Login overlay -->
<div id="login-overlay">
  <div class="login-box">
    <h2>Video Dashboard</h2>
    <p>Enter your PIN to access the dashboard.</p>
    <input type="password" id="pin-input" class="login-input" maxlength="20" placeholder="••••••" autocomplete="current-password">
    <button class="login-btn" onclick="checkPin()">Enter Dashboard</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- App shell -->
<div class="app">

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">Crown Media Group</span>
      <span class="topbar-badge">Video Admin</span>
    </div>
    <div class="topbar-right">
      <span id="realtime-dot" style="width:8px;height:8px;background:#4ade80;border-radius:50%;display:inline-block;" title="Realtime connected"></span>
      <span style="font-size:0.75rem;color:var(--text-mid);" id="last-refresh">Loading...</span>
      <button class="btn btn-gold" onclick="loadProjects()" style="padding:6px 14px;font-size:0.72rem;">Refresh</button>
    </div>
  </div>

  <!-- Stats bar -->
  <div class="stats-bar">
    <div class="stat-item"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total</div></div>
    <div class="stat-item"><div class="stat-num" id="stat-review">0</div><div class="stat-label">Review</div></div>
    <div class="stat-item"><div class="stat-num" id="stat-scheduled">0</div><div class="stat-label">Scheduled</div></div>
    <div class="stat-item"><div class="stat-num" id="stat-posted">0</div><div class="stat-label">Posted</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs-bar">
    <button class="tab-btn active" onclick="switchTab('projects')">Projects</button>
    <button class="tab-btn" onclick="switchTab('calendar')">Calendar</button>
    <button class="tab-btn" onclick="switchTab('revenue')">Revenue</button>
  </div>

  <!-- Tab content -->
  <div class="tab-content">

    <!-- PROJECTS TAB -->
    <div class="tab-pane active" id="pane-projects">
      <div class="projects-pane">

        <!-- Sidebar: list -->
        <div class="projects-sidebar">
          <div class="sidebar-filters">
            <button class="filter-chip active" onclick="setFilter('all', this)">All</button>
            <button class="filter-chip" onclick="setFilter('uploaded', this)">New</button>
            <button class="filter-chip" onclick="setFilter('ready_review', this)">Review</button>
            <button class="filter-chip" onclick="setFilter('approved', this)">Approved</button>
            <button class="filter-chip" onclick="setFilter('scheduled', this)">Scheduled</button>
            <button class="filter-chip" onclick="setFilter('posted', this)">Posted</button>
          </div>
          <div class="projects-list" id="projects-list">
            <div style="padding:20px;text-align:center;color:var(--text-dim);font-size:0.85rem;">Loading projects...</div>
          </div>
        </div>

        <!-- Detail panel -->
        <div class="project-detail" id="project-detail">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M10 8l6 4-6 4V8z"/></svg>
            <p>Select a project to review</p>
          </div>
        </div>

      </div>
    </div>

    <!-- CALENDAR TAB -->
    <div class="tab-pane" id="pane-calendar">
      <div class="calendar-pane">
        <div id="calendar"></div>
      </div>
    </div>

    <!-- REVENUE TAB -->
    <div class="tab-pane" id="pane-revenue">
      <div class="revenue-pane">
        <div class="chart-wrap">
          <canvas id="revenue-chart"></canvas>
        </div>
        <div class="detail-section">
          <div class="detail-section-header">
            Monthly Revenue
            <button class="btn btn-gold" onclick="generateReport()" style="padding:5px 12px;font-size:0.72rem;text-transform:none;font-weight:600;">Generate Report</button>
          </div>
          <div class="detail-section-body">
            <table style="width:100%;border-collapse:collapse;font-size:0.82rem;">
              <thead>
                <tr style="color:var(--text-dim);">
                  <th style="text-align:left;padding:6px 10px;font-weight:600;text-transform:uppercase;font-size:0.7rem;letter-spacing:.04em;">Client</th>
                  <th style="text-align:center;padding:6px 10px;">Projects</th>
                  <th style="text-align:right;padding:6px 10px;">Gross</th>
                  <th style="text-align:right;padding:6px 10px;">Tax (27%)</th>
                  <th style="text-align:right;padding:6px 10px;">Net</th>
                  <th style="text-align:center;padding:6px 10px;">Paid</th>
                </tr>
              </thead>
              <tbody id="revenue-tbody">
                <tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:20px;">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.js"></script>
<script src="app.js"></script>

</body>
</html>
