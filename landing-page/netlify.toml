[build]
  command = "npm install && node scripts/build-blog.cjs"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200

[[redirects]]
  from = "/blog/"
  to = "/blog/index.html"
  status = 200

[[triggers]]
  event = "submission-created"
  functions = ["form-submission"]

# ── KINGDOM EDGE BOT SCHEDULERS ──────────────────────────────────────────────
# Stock bot — every 5 min during NYSE regular hours (13:30–20:00 UTC, Mon–Fri).
# Daily P&L reconciler — 21:30 UTC (~30 min after NYSE close) — populates daily_pnl
# field that the daily-loss risk gate reads.
# Cron uses UTC. NYSE 09:30–16:00 ET = 13:30–20:00 UTC envelope (DST tolerant).
[functions."edge-bot-runner"]
  schedule = "*/5 13-20 * * 1-5"

[functions."edge-daily-pnl-reconcile"]
  schedule = "30 21 * * 1-5"

# ── KINGDOM REACH AUTOPILOT ──────────────────────────────────────────────────
# Weekly outreach fire — Monday 14:00 UTC (9am EST)
[functions."outreach-weekly-fire"]
  schedule = "0 14 * * 1"

# Gmail reply poll — every 6 hours
[functions."outreach-reply-poll"]
  schedule = "0 */6 * * *"

# Safety monitor — daily 04:00 UTC
[functions."outreach-safety-monitor"]
  schedule = "0 4 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://crm.crownmediagroup.co https://allglory-onboarding-production.up.railway.app https://pcikjtzvruvavaduawes.supabase.co; frame-src https://www.youtube.com; frame-ancestors 'none'"
