name: Blog → YouTube Video Pipeline

# Triggers:
# 1. Auto — runs after auto-blog.yml completes (new post generated)
# 2. Manual — dispatch with optional file override

on:
  workflow_run:
    workflows: ["Auto Blog — Generate + Post"]
    types: [completed]
  workflow_dispatch:
    inputs:
      file:
        description: 'Specific markdown file (e.g. 2026-04-01-my-post.md). Leave blank for auto.'
        required: false
      unlisted:
        description: 'Upload as unlisted? (true/false)'
        required: false
        default: 'false'
      skip_upload:
        description: 'Skip YouTube upload? (true/false)'
        required: false
        default: 'false'

jobs:
  generate-video:
    # Only run if triggered by successful workflow_run, or manually dispatched
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        working-directory: landing-page
        run: npm ci

      - name: Verify FFmpeg (pre-installed on ubuntu-latest)
        run: ffmpeg -version | head -1

      - name: Run Blog-to-Video pipeline
        working-directory: landing-page
        env:
          ANTHROPIC_API_KEY:              ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY:             ${{ secrets.ELEVENLABS_API_KEY }}
          RECRAFT_API_KEY:                ${{ secrets.RECRAFT_API_KEY }}
          YOUTUBE_SERVICE_ACCOUNT_JSON:   ${{ secrets.YOUTUBE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_CHANNEL_ID:             ${{ secrets.YOUTUBE_CHANNEL_ID }}
          RESEND_API_KEY:                 ${{ secrets.RESEND_API_KEY }}
        run: |
          FILE_ARG=""
          UNLISTED_ARG=""
          SKIP_ARG=""
          if [ -n "${{ github.event.inputs.file }}" ]; then
            FILE_ARG="--file ${{ github.event.inputs.file }}"
          fi
          if [ "${{ github.event.inputs.unlisted }}" = "true" ]; then
            UNLISTED_ARG="--unlisted"
          fi
          if [ "${{ github.event.inputs.skip_upload }}" = "true" ] || [ -z "$YOUTUBE_SERVICE_ACCOUNT_JSON" ]; then
            SKIP_ARG="--skip-upload"
          fi
          node scripts/blog-to-video.js $FILE_ARG $UNLISTED_ARG $SKIP_ARG --skip-social

      - name: Commit video log update
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "Crown Media Bot"
          git add landing-page/content/blog/.video-log.json || true
          git diff --staged --quiet || git commit -m "chore: update video-log.json [skip ci]"
          git push || true

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const msg = `Blog-to-Video pipeline failed on ${new Date().toISOString()}. Check logs at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            console.log(msg);
