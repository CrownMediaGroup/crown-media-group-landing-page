name: Auto-Blog — Crown Media Group

# ── Best times to publish for Columbia SC small business audience ──────────────
# 6 posts per day at evenly-spaced peak audience times (EST → UTC):
#   7:00 AM EST  = 12:00 UTC  (morning commute / coffee)
#  10:00 AM EST  = 15:00 UTC  (mid-morning desk time)
#   1:00 PM EST  = 18:00 UTC  (lunch break browsing)
#   4:00 PM EST  = 21:00 UTC  (end-of-workday wind-down)
#   7:00 PM EST  = 00:00 UTC  (evening discovery)
#  10:00 PM EST  = 03:00 UTC  (late-night research / planning)
# Saturday is skipped (Sabbath). Sunday runs normally.

on:
  schedule:
    - cron: '0 12 * * 0,1,2,3,4,5'  # 7:00 AM EST  — Sun–Fri (no Sat)
    - cron: '0 15 * * 0,1,2,3,4,5'  # 10:00 AM EST — Sun–Fri
    - cron: '0 18 * * 0,1,2,3,4,5'  # 1:00 PM EST  — Sun–Fri
    - cron: '0 21 * * 0,1,2,3,4,5'  # 4:00 PM EST  — Sun–Fri
    - cron: '0 0  * * 0,1,2,3,4,5'  # 7:00 PM EST  — Sun–Fri
    - cron: '0 3  * * 0,1,2,3,4,5'  # 10:00 PM EST — Sun–Fri

  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom topic (leave blank to use queue)'
        required: false
      keyword:
        description: 'Primary keyword'
        required: false
      category:
        description: 'Category'
        required: false
        default: 'Marketing'
      skip_research:
        description: 'Skip queue research step'
        required: false
        default: 'false'

jobs:
  write-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node setup ────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        working-directory: landing-page
        run: npm install

      # ── 4. CONTINGENCY 1: Queue health check + auto-refill ───────────────────
      # If queue drops below 5, regenerate 25 fresh topics before writing.
      # This ensures the system NEVER runs out of content to write.
      - name: Queue health check & auto-refill
        if: ${{ !inputs.topic }}
        working-directory: landing-page
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: true
        run: |
          QUEUE_COUNT=$(node -e "
            const { readFileSync, existsSync } = require('fs');
            const f = 'content/blog/topics-queue.json';
            if (!existsSync(f)) { console.log('0'); process.exit(0); }
            const d = JSON.parse(readFileSync(f, 'utf8'));
            const q = Array.isArray(d) ? d : (d.queue || []);
            console.log(q.length);
          " 2>/dev/null || echo "0")
          echo "Queue size: $QUEUE_COUNT"
          if [ "$QUEUE_COUNT" -lt 5 ]; then
            echo "Queue below 5 — auto-refilling 25 topics..."
            node scripts/blog-researcher.js --count 25 || echo "Researcher failed — will use fallback topics"
          else
            echo "Queue healthy ($QUEUE_COUNT topics). No refill needed."
          fi
        shell: bash

      # ── 5a. Generate post from queue (with retry + fallback) ─────────────────
      # Attempt 1: from queue. Attempt 2: hardcoded evergreen topic. Attempt 3: static fallback post.
      # CONTINGENCY 2: 3-attempt retry chain so failures NEVER skip a publishing slot.
      - name: Generate post from queue
        if: ${{ !inputs.topic }}
        working-directory: landing-page
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: true
        run: |
          echo "=== Attempt 1: from queue ==="
          node scripts/blog-writer.js --from-queue --publish && exit 0 || echo "Attempt 1 failed"

          echo "=== Attempt 2: evergreen fallback topic ==="
          FALLBACK_TOPICS=(
            "How Columbia SC Small Businesses Can Use AI to Get More Customers|AI marketing for Columbia SC small businesses|Marketing"
            "Why Your Columbia SC Business Needs Social Media Management in 2026|social media management Columbia SC|Marketing"
            "The Beginner's Guide to Facebook Ads for Columbia SC Business Owners|Facebook ads Columbia SC|Ads"
            "5 Signs Your Columbia SC Business Needs a New Marketing Strategy|marketing strategy Columbia SC|Marketing"
            "How to Get Your Columbia SC Business Found on Google|local SEO Columbia SC|SEO"
            "Email Marketing for Columbia SC Businesses — The Complete Guide|email marketing Columbia SC|Marketing"
          )
          RANDOM_IDX=$((RANDOM % ${#FALLBACK_TOPICS[@]}))
          IFS='|' read -r FB_TOPIC FB_KEYWORD FB_CAT <<< "${FALLBACK_TOPICS[$RANDOM_IDX]}"
          echo "Fallback topic: $FB_TOPIC"
          node scripts/blog-writer.js \
            --topic "$FB_TOPIC" \
            --keyword "$FB_KEYWORD" \
            --category "$FB_CAT" \
            --publish && exit 0 || echo "Attempt 2 failed"

          echo "=== Attempt 3: static fallback post ==="
          # CONTINGENCY 3: Pre-written evergreen post committed to repo as ultimate safety net.
          # If Claude API is completely down, we still publish something.
          # Filename includes hour so 6 daily runs each produce a UNIQUE file
          # (previously they all overwrote the same filename, killing 5 of 6 posts).
          if [ -f "content/blog/fallback-post.md" ]; then
            FALLBACK_DATE=$(date +'%Y-%m-%d')
            FALLBACK_HOUR=$(date +'%H')
            FALLBACK_SLUG="${FALLBACK_DATE}-${FALLBACK_HOUR}h-local-marketing-guide"
            cp content/blog/fallback-post.md "content/blog/${FALLBACK_SLUG}.md"
            sed -i "s/DATE_PLACEHOLDER/${FALLBACK_DATE}/g" "content/blog/${FALLBACK_SLUG}.md" || true
            echo "Fallback post deployed for ${FALLBACK_DATE} hour ${FALLBACK_HOUR}"
            exit 0
          fi

          echo "All 3 attempts failed — sending alert"
          exit 1
        shell: bash

      # ── 5b. Generate post from custom topic (manual trigger) ─────────────────
      - name: Generate post from custom topic
        if: ${{ inputs.topic }}
        working-directory: landing-page
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: true
        run: |
          node scripts/blog-writer.js \
            --topic "${{ inputs.topic }}" \
            --keyword "${{ inputs.keyword || inputs.topic }}" \
            --category "${{ inputs.category }}" \
            --publish

      # ── 6. Build blog HTML from markdown ─────────────────────────────────────
      - name: Build blog HTML
        working-directory: landing-page
        run: node scripts/build-blog.cjs

      # ── 7. Commit and push ────────────────────────────────────────────────────
      - name: Commit and push new post
        run: |
          git config user.name "Crown Media Bot"
          git config user.email "king@crownmediagroup.co"
          git add landing-page/content/blog/ landing-page/blog/ landing-page/feed.xml landing-page/sitemap.xml
          git diff --staged --quiet || git commit -m "auto-blog: $(date +'%Y-%m-%d %H:%M') EST post"
          git push

      # ── 8. Distribute — email King with social captions ───────────────────────
      - name: Distribute post (email + social captions)
        if: success()
        working-directory: landing-page
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/blog-distributor.js || echo "Distribution step failed — post still published"

      # ── 8b. Auto-post to X, LinkedIn, Facebook, Reddit ───────────────────────
      # Skips any platform where secrets are not set — never fails the whole workflow
      - name: Post to social platforms
        if: success()
        working-directory: landing-page
        env:
          X_API_KEY:                   ${{ secrets.X_API_KEY }}
          X_API_SECRET:                ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:              ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET:       ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LINKEDIN_ACCESS_TOKEN:       ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN:         ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_ORG_URN:            ${{ secrets.LINKEDIN_ORG_URN }}
          FACEBOOK_PAGE_ID:            ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN:  ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          REDDIT_CLIENT_ID:            ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET:        ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME:             ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD:             ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_SUBREDDITS:           ${{ secrets.REDDIT_SUBREDDITS }}
          MEDIUM_INTEGRATION_TOKEN:    ${{ secrets.MEDIUM_INTEGRATION_TOKEN }}
          HASHNODE_ACCESS_TOKEN:       ${{ secrets.HASHNODE_ACCESS_TOKEN }}
          HASHNODE_PUBLICATION_ID:     ${{ secrets.HASHNODE_PUBLICATION_ID }}
        run: node scripts/blog-social-promoter-api.js || echo "Social promotion had errors — post still live"

      # ── 9. Failure notification (all 3 contingencies failed) ─────────────────
      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "Crown Media Group <king@crownmediagroup.co>",
              "to": ["king@crownmediagroup.co"],
              "subject": "Auto-blog FAILED — all 3 contingencies triggered",
              "html": "<p><strong>All 3 contingency plans failed</strong> for the auto-blog run at <strong>'"$(date)"'</strong>.</p><p>This means: the Claude API may be down, the queue is empty, AND the fallback post is missing.</p><p>Action needed: <a href=\"https://github.com/CrownMediaGroup/crown-media-group-landing-page/actions\">Check GitHub Actions</a></p><p><em>Next scheduled attempt in ~6 hours. All Glory to Jesus.</em></p>"
            }' || true
