<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal — Crown Media Group</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c8a45a;
      --dark: #0d0d0d;
      --card: #141414;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #888;
      --red: #ff4444;
      --orange: #ff8c00;
      --yellow: #ffd700;
      --green: #22c55e;
    }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Login screen ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }

    .login-box .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-box .logo span {
      font-size: 22px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: -0.5px;
    }

    .login-box .logo p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus { border-color: var(--gold); }

    .btn-primary {
      width: 100%;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    #login-error {
      color: var(--red);
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }

    /* ── Portal dashboard ── */
    #portal-screen { display: none; }

    .portal-header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .portal-header .brand {
      font-size: 16px;
      font-weight: 700;
      color: var(--gold);
    }

    .portal-header .client-name {
      font-size: 13px;
      color: var(--muted);
    }

    .logout-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .logout-btn:hover { color: var(--text); }

    .portal-body {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px;
      display: grid;
      gap: 24px;
    }

    .welcome-banner {
      background: linear-gradient(135deg, #1a1500 0%, #1a1200 100%);
      border: 1px solid #3a2e00;
      border-radius: 12px;
      padding: 28px 32px;
    }

    .welcome-banner h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .welcome-banner p {
      font-size: 14px;
      color: var(--muted);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-header h2 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .panel-header .badge {
      font-size: 11px;
      background: #222;
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 20px;
      color: var(--muted);
    }

    .panel-body { padding: 16px 20px; }

    /* Traffic lights */
    .tl-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .tl-red    { background: var(--red); }
    .tl-orange { background: var(--orange); }
    .tl-yellow { background: var(--yellow); }
    .tl-green  { background: var(--green); }

    .request-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .request-item:last-child { border-bottom: none; }

    .request-item .dot-wrap { padding-top: 4px; }

    .request-item .req-desc {
      font-size: 13px;
      color: var(--text);
      line-height: 1.4;
      flex: 1;
    }

    .request-item .req-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .request-item .req-status {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      flex-shrink: 0;
      align-self: flex-start;
    }

    .status-red    { background: rgba(255,68,68,0.15);  color: var(--red); }
    .status-orange { background: rgba(255,140,0,0.15);  color: var(--orange); }
    .status-yellow { background: rgba(255,215,0,0.15);  color: var(--yellow); }
    .status-green  { background: rgba(34,197,94,0.15);  color: var(--green); }

    /* Content queue */
    .content-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .content-item:last-child { border-bottom: none; }

    .content-item .content-icon {
      width: 32px;
      height: 32px;
      background: #1e1e1e;
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .content-item .content-name {
      flex: 1;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .content-item .content-date {
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* Content brief */
    .brief-panel { grid-column: 1 / -1; }

    .brief-text {
      font-size: 13px;
      color: #bbb;
      line-height: 1.7;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
    }

    /* Submit request */
    .submit-panel { grid-column: 1 / -1; }

    .submit-panel textarea {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 14px;
      resize: vertical;
      min-height: 90px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .submit-panel textarea:focus { border-color: var(--gold); }

    .submit-btn {
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #submit-msg {
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

<!-- ── Login Screen ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">
      <span>Crown Media Group</span>
      <p>Client Portal</p>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@yourbusiness.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Sign In</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ── Portal Dashboard ── -->
<div id="portal-screen">
  <header class="portal-header">
    <div class="brand">Crown Media Group</div>
    <div class="client-name" id="header-name"></div>
    <button class="logout-btn" onclick="doLogout()">Sign Out</button>
  </header>

  <div class="portal-body" id="portal-body">
    <div class="loading-state">Loading your portal...</div>
  </div>
</div>

<script>
  const API = '';

  // ── Auth ───────────────────────────────────────────────────────────────────

  async function doLogin() {
    const btn   = document.getElementById('login-btn');
    const err   = document.getElementById('login-error');
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-password').value;

    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
      const res = await fetch('/api/portal/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password: pass }),
      });
      const data = await res.json();

      if (!data.ok) {
        err.textContent = data.error || 'Login failed.';
        err.style.display = 'block';
      } else {
        showPortal();
      }
    } catch (e) {
      err.textContent = 'Connection error. Try again.';
      err.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  }

  function doLogout() {
    document.cookie = 'portal_session=; Path=/portal; Max-Age=0';
    location.reload();
  }

  // Allow Enter key on login form
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') doLogin();
  });

  // ── Portal ─────────────────────────────────────────────────────────────────

  async function showPortal() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('portal-screen').style.display = 'block';
    await loadPortalData();
  }

  async function loadPortalData() {
    try {
      const res  = await fetch('/api/portal/data', { credentials: 'include' });
      const data = await res.json();

      if (!data.ok) {
        if (res.status === 401) { location.reload(); return; }
        throw new Error(data.error || 'Failed to load');
      }

      renderPortal(data);
    } catch (e) {
      document.getElementById('portal-body').innerHTML =
        `<div class="loading-state" style="color:#ff4444">Error loading portal: ${e.message}</div>`;
    }
  }

  function renderPortal(data) {
    const { client, contentQueue, maintenanceRequests, contentBrief } = data;

    document.getElementById('header-name').textContent = client.company || client.name;

    const tlLabel = {
      red: 'Urgent',
      orange: 'Needs Attention',
      yellow: 'Queued',
      green_pending: 'Pending Confirmation',
      green: 'Complete',
    };

    const requestsHtml = maintenanceRequests.length
      ? maintenanceRequests.map(r => {
          const tl = r.traffic_light || 'yellow';
          return `
            <div class="request-item">
              <div class="dot-wrap"><span class="tl-dot tl-${tl.replace('_pending','')}"></span></div>
              <div style="flex:1">
                <div class="req-desc">${esc(r.description)}</div>
                <div class="req-meta">${r.ai_category || ''} · ${formatDate(r.created_at)}</div>
              </div>
              <span class="req-status status-${tl.replace('_pending','')}">${tlLabel[tl] || tl}</span>
            </div>`;
        }).join('')
      : '<div class="empty-state">No requests yet.</div>';

    const contentHtml = contentQueue.length
      ? contentQueue.map(c => `
          <div class="content-item">
            <div class="content-icon">${c.type === 'social' ? '📱' : '📝'}</div>
            <div class="content-name">${esc(c.file)}</div>
            <div class="content-date">${c.date}</div>
          </div>`).join('')
      : '<div class="empty-state">Content is being prepared. Check back soon.</div>';

    const briefHtml = contentBrief
      ? `<div class="brief-text">${esc(contentBrief)}</div>`
      : '<div class="empty-state">Your content brief will appear here once your onboarding is complete.</div>';

    document.getElementById('portal-body').innerHTML = `
      <div class="welcome-banner">
        <h1>Welcome back, ${esc(client.name.split(' ')[0])}</h1>
        <p>Here's everything happening with your account at Crown Media Group.</p>
      </div>

      <div class="grid-2">
        <div class="panel">
          <div class="panel-header">
            <h2>Maintenance Requests</h2>
            <span class="badge">${maintenanceRequests.length} total</span>
          </div>
          <div class="panel-body">${requestsHtml}</div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>Content Queue</h2>
            <span class="badge">${contentQueue.length} items</span>
          </div>
          <div class="panel-body">${contentHtml}</div>
        </div>
      </div>

      <div class="panel brief-panel">
        <div class="panel-header">
          <h2>Your Content Brief</h2>
        </div>
        <div class="panel-body">${briefHtml}</div>
      </div>

      <div class="panel submit-panel">
        <div class="panel-header">
          <h2>Submit a Request</h2>
        </div>
        <div class="panel-body">
          <textarea id="req-text" placeholder="Describe what you need — content update, website change, new post, etc."></textarea>
          <button class="submit-btn" onclick="submitRequest()">Submit Request</button>
          <div id="submit-msg"></div>
        </div>
      </div>
    `;
  }

  async function submitRequest() {
    const btn  = document.querySelector('.submit-btn');
    const msg  = document.getElementById('submit-msg');
    const text = document.getElementById('req-text').value.trim();

    if (!text) return;
    btn.disabled = true;
    msg.style.display = 'none';

    try {
      const res  = await fetch('/api/maintenance/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ description: text, contact_name: '', contact_email: '' }),
      });
      const data = await res.json();

      if (data.ok) {
        document.getElementById('req-text').value = '';
        msg.style.color = '#22c55e';
        msg.textContent = 'Request submitted. We\'ll handle it and follow up.';
        msg.style.display = 'block';
        setTimeout(() => loadPortalData(), 1500);
      } else {
        throw new Error(data.error || 'Submission failed');
      }
    } catch (e) {
      msg.style.color = '#ff4444';
      msg.textContent = 'Error: ' + e.message;
      msg.style.display = 'block';
    } finally {
      btn.disabled = false;
    }
  }

  // ── Helpers ────────────────────────────────────────────────────────────────

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // ── Init: check if already logged in ──────────────────────────────────────

  (async function init() {
    try {
      const res  = await fetch('/api/portal/data', { credentials: 'include' });
      const data = await res.json();
      if (data.ok) {
        showPortal();
      } else {
        document.getElementById('login-screen').style.display = 'flex';
      }
    } catch {
      document.getElementById('login-screen').style.display = 'flex';
    }
  })();
</script>
</body>
</html>
